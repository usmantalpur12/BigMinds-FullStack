name: Build Android APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build Profile'
        required: false
        default: 'production'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./BigMindsEducation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: BigMindsEducation/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Check EXPO_TOKEN
        id: check-token
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "token_set=true" >> $GITHUB_OUTPUT
          else
            echo "token_set=false" >> $GITHUB_OUTPUT
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EXPO_TOKEN
        if: steps.check-token.outputs.token_set == 'false'
        run: |
          echo "::warning::EXPO_TOKEN GitHub secret is not set."
          echo "To enable automated APK builds, create an Expo access token at:"
          echo "https://expo.dev/accounts/usmantalpur/settings/access-tokens"
          echo "Then add it as the EXPO_TOKEN secret in GitHub repo settings."
          echo "Skipping EAS build for this run."

      - name: EAS Build
        id: eas-build
        if: steps.check-token.outputs.token_set == 'true'
        run: |
          eas build --platform android \
            --profile ${{ inputs.build_profile || 'production' }} \
            --non-interactive \
            --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: List APK artifacts
        if: steps.eas-build.outcome == 'success'
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -exec ls -la {} \;
          echo "---"

      - name: Upload APK Artifact
        if: steps.eas-build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bigminds-apk
          path: ./BigMindsEducation/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release and Upload APK
        if: github.event_name == 'release' && steps.eas-build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: ./BigMindsEducation/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (for workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.eas-build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: APK Build - Run #${{ github.run_number }}
          prerelease: true
          files: ./BigMindsEducation/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
